name: Deploy
on:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build
  build-push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: devashishbelwal/authtodo
          tags: type=sha,prefix=,suffix=,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: devashishbelwal/authtodo:${{ github.sha }},devashishbelwal/authtodo:latest
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/AuthTodo
            PREVIOUS=$(docker inspect --format='{{.Config.Image}}' authtodo_app 2>/dev/null || echo "authtodo-app")
            NEW=${{ github.sha }}
            docker pull devashishbelwal/authtodo:${NEW}
            IMAGE_TAG=${{ github.sha }} docker compose up -d
            sleep 5
            for i in 1 2 3 4 5 6; do
              if curl -sf https://authtodo.dabelwal.online/api/health >/dev/null 2>&1; then echo "Health OK"; exit 0; fi
              sleep 5
            done
            echo "Health failed; rolling back to $PREVIOUS"
            IMAGE_TAG=${PREVIOUS} docker compose up -d
            sleep 5
            curl -sf https://authtodo.dabelwal.online/api/health >/dev/null 2>&1 || (echo "Rollback health failed"; exit 1)
            exit 1
